name: Generate Release Keystore (sekali saja)

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: "Password keystore (min 6 karakter). CATAT & SIMPAN baik-baik!"
        required: true
      key_password:
        description: "Password key (isi sama dengan store password)"
        required: true

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        env:
          STORE_PASSWORD: ${{ github.event.inputs.store_password }}
          KEY_PASSWORD: ${{ github.event.inputs.key_password }}
        run: |
          keytool -genkeypair -v \
            -keystore release-keystore.jks \
            -alias upload \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=Mie Ayam Arsy, OU=Warung, O=Arsy, L=Indonesia, C=ID"

      - name: Encode ke base64
        run: base64 -w 0 release-keystore.jks > keystore-base64.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release-keystore.jks
            keystore-base64.txt
          retention-days: 1

      - name: Petunjuk
        run: |
          echo "## Keystore berhasil dibuat" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download artifact **release-keystore** (tombol di bagian bawah halaman run ini)." >> $GITHUB_STEP_SUMMARY
          echo "2. Buka file \`keystore-base64.txt\`, salin SELURUH isinya." >> $GITHUB_STEP_SUMMARY
          echo "3. Buka Settings > Secrets and variables > Actions, buat 3 Repository secrets:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`KEYSTORE_BASE64\` = isi \`keystore-base64.txt\`" >> $GITHUB_STEP_SUMMARY
          echo "   - \`STORE_PASSWORD\` = password yang tadi Anda masukkan" >> $GITHUB_STEP_SUMMARY
          echo "   - \`KEY_PASSWORD\` = password key yang tadi Anda masukkan" >> $GITHUB_STEP_SUMMARY
          echo "4. Simpan file \`.jks\` di tempat aman. Jangan di-commit ke GitHub." >> $GITHUB_STEP_SUMMARY
          echo "5. Setelah secrets dibuat, HAPUS run ini dan artifact-nya (Actions > pilih run > Delete run)." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> PENTING: Jaga kerahasiaan keystore & password. Siapa pun yang memilikinya bisa menerbitkan update palsu." >> $GITHUB_STEP_SUMMARY
